<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Collaboration Signup</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 60px auto;
        padding: 20px;
      }
      input,
      textarea,
      button {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        margin-top: 6px;
        margin-bottom: 20px;
        font-size: 16px;
      }
      button {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div
      style="
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 60px;
        margin-bottom: 40px;
      "
    >
      <img src="psa-logo.png" alt="PSA Logo" style="height: 80px" />
      <img
        src="many-languages-logo.png"
        alt="Many Languages Logo"
        style="height: 80px"
      />
    </div>

    <div style="text-align: center">
      <h2>Sign up to join the collaboration</h2>
    </div>

    <form id="signupForm">
      <label>First Name</label>
      <input type="text" id="first_name" required />

      <label>Last Name</label>
      <input type="text" id="last_name" required />

      <label>Email</label>
      <input type="email" id="email" required />

      <label>Projects you’re interested in / notes</label>
      <textarea id="project_notes" rows="4"></textarea>

      <!-- Honeypot field: hidden from real users, bots often fill it in -->
      <div style="position: absolute; left: -9999px" aria-hidden="true">
        <label for="website">Website</label>
        <input type="text" id="website" name="website" tabindex="-1" autocomplete="off" />
      </div>

      <label
        style="
          display: flex;
          align-items: center;
          gap: 10px;
          margin-bottom: 20px;
        "
      >
        <input
          type="checkbox"
          id="join_accelerator"
          style="width: auto; margin: 0; transform: translateY(2px)"
        />
        <span>I would like to join the Psychological Science Accelerator</span>
      </label>

      <label
        style="
          display: flex;
          align-items: center;
          gap: 10px;
          margin-bottom: 20px;
        "
      >
        <input
          type="checkbox"
          id="join_many_languages"
          style="width: auto; margin: 0; transform: translateY(2px)"
        />
        <span>I would like to join ManyLanguages</span>
      </label>

      <button type="submit">Sign Up</button>
    </form>

    <script>
      // Update this once the worker is deployed (see worker/README.md).
      const WORKER_URL = "https://psa-member-signup.<your-subdomain>.workers.dev/submit";

      document
        .getElementById("signupForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const first = document.getElementById("first_name").value.trim();
          const last = document.getElementById("last_name").value.trim();
          const email = document.getElementById("email").value.trim();
          const notes = document.getElementById("project_notes").value.trim();

          const joinAccelerator = document.getElementById("join_accelerator")
            .checked
            ? "Yes"
            : "No";
          const joinManyLanguages = document.getElementById(
            "join_many_languages",
          ).checked
            ? "Yes"
            : "No";
          const website = document.getElementById("website").value.trim();

          try {
            const response = await fetch(WORKER_URL, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                first,
                last,
                email,
                notes,
                joinAccelerator,
                joinManyLanguages,
                website,
              }),
            });

            if (!response.ok) {
              throw new Error("Submission failed");
            }

            document.getElementById("signupForm").innerHTML = `
              <h3>Thank you for signing up!</h3>
              <p>Your information has been successfully recorded.</p>
              <p>
                You will receive information about joining the Psychological Science
                Accelerator and/or Many Languages shortly.
              </p>
            `;
          } catch (err) {
            document.getElementById("signupForm").innerHTML = `
              <h3>Something went wrong</h3>
              <p>
                We were unable to record your signup automatically.
                Please try again in a few moments.
              </p>
            `;
          }
        });
    </script>
  </body>
</html>
