name = "psa-member-signup"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Created with: wrangler d1 create psa-member-signup
# Then paste the resulting database_id below.
[[d1_databases]]
binding = "DB"
database_name = "psa-member-signup"
database_id = "b2d36cea-e776-4cbc-b21b-470de9d27d08"

# Set the real values as secrets, not here:
#   wrangler secret put SENDGRID_API_KEY
#   wrangler secret put HMAC_SECRET
#   wrangler secret put CANVAS_API_TOKEN
[vars]
ADMIN_EMAIL = "psa.membersite@gmail.com"
FROM_EMAIL = "canvas@psysciacc.org"
CANVAS_BASE_URL = "https://canvas.psysciacc.org"
CANVAS_ACCOUNT_ID = "1"
ALLOWED_ORIGIN = "https://member.psysciacc.org"
# Spam controls: reject submissions faster than this (bots skip the "fill out a form" delay)...
MIN_SUBMIT_MS = "3000"
# ...and cap how many /submit attempts one IP can make per hour.
RATE_LIMIT_PER_HOUR = "5"
